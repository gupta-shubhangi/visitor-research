                                    <div className="dq-panel">
                                        <p>Disqualifying criteria met: {dqFlags.join(', ')}</p>
                                        <button className="btn btn-danger btn-sm" onClick={() => { setDqMode(true); if (!dqReason) setDqReason(dqFlags.join('; ')); }}>Disqualify visitor</button>
                                    </div>
                                )}
                                {!dqMode && project.enableInterviews && (
                                    <label className="checkbox-label" style={{ margin: '4px 0 16px' }}><input type="checkbox" checked={interviewThis} onChange={e => setInterviewThis(e.target.checked)} />Interview this visitor if they qualify{!interviewEligible && <span style={{ fontSize: '12px', color: 'var(--ink-muted)', marginLeft: '6px' }}>(timer not up yet)</span>}</label>
                                )}
                                {!dqMode && <VisitorForm timerRunning={timerRunning} project={project} visitorData={visitorData} setVisitorData={setVisitorData} onSave={() => saveVisitor(false, '')} onCancel={cancelVisitor} />}
                            </>
                        )}

                        {ls.visitors.length > 0 && (
                            <>
                                <h2>Session Data ({ls.visitors.length} visitor{ls.visitors.length !== 1 ? 's' : ''}{ls.visitors.filter(v => v.disqualified).length > 0 && (', ' + ls.visitors.filter(v => v.disqualified).length + ' DQ\'d')})</h2>
                                <div style={{ overflowX: 'auto' }}>
                                    <table><thead><tr><th>#</th>{project.enableInterviews && <th>Obs/Int</th>}<th>Status</th><th>Start</th><th>End</th><th>Duration</th>{project.fields.map(f => <th key={f.id}>{f.name}</th>)}<th style={{ width: '80px' }}></th></tr></thead>
                                    <tbody>{ls.visitors.map((v, idx) => (
                                        <React.Fragment key={idx}>
                                        <tr className={v.disqualified ? 'disqualified' : ''}>
                                            <td>{v.visitorNumber || idx+1}</td>
                                            {project.enableInterviews && <td>{v.isInterview ? '✓' : v.isObserved ? 'Obs' : ''}</td>}
                                            <td>{v.disqualified ? <><span className="dq-badge">DQ</span>{v.dqReason && <span style={{ fontSize: '11px', color: 'var(--ink-muted)', marginLeft: '6px' }} title={v.dqReason}>{v.dqReason.length > 20 ? v.dqReason.slice(0,20) + '...' : v.dqReason}</span>}</> : <span style={{ color: 'var(--success)', fontSize: '11px', fontWeight: 600 }}>OK</span>}</td>
                                            <td>{v.startTime ? new Date(v.startTime).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '-'}</td>
                                            <td>{v.endTime ? new Date(v.endTime).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '-'}</td>
                                            <td style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: '12px' }}>{formatTime(v.duration)}</td>
                                            {project.fields.map(field => (
                                                <td key={field.id} className="edit-cell" onClick={() => setEditingVisitor({ index: idx, fieldId: field.id })}>
                                                    {editingVisitor && editingVisitor.index === idx && editingVisitor.fieldId === field.id ? (
                                                        field.type === 'checkbox' ? (
                                                            <div onClick={e => e.stopPropagation()}>
                                                                {field.options.map(o => { const sel = v.data[field.id] || []; const on = sel.includes(o.label); return <label key={o.label} className="checkbox-label" style={{ marginBottom: '2px' }}><input type="checkbox" checked={on} onChange={() => updateVisitor(idx, field.id, on ? sel.filter(x => x !== o.label) : [...sel, o.label])} /><span style={dqWhenOf(o) ? { color: 'var(--danger)' } : {}}>{o.label}{dqWhenOf(o) === 'checked' ? ' (DQ if checked)' : dqWhenOf(o) === 'unchecked' ? ' (DQ if not checked)' : ''}</span></label>; })}
                                                                <button className="btn btn-sm" style={{ marginTop: '4px' }} onClick={() => setEditingVisitor(null)}>Done</button>
                                                            </div>
                                                        ) : field.type === 'select' ? (
                                                            <select className="edit-input" value={v.data[field.id] || ''} onChange={e => { updateVisitor(idx, field.id, e.target.value); setEditingVisitor(null); }} onBlur={() => setEditingVisitor(null)} autoFocus><option value="">Select...</option>{field.options.map(opt => <option key={opt} value={opt}>{opt}</option>)}</select>
                                                        ) : (<input className="edit-input" type={field.type === 'number' ? 'number' : 'text'} value={v.data[field.id] || ''} onChange={e => updateVisitor(idx, field.id, e.target.value)} onBlur={() => setEditingVisitor(null)} onKeyDown={e => { if (e.key === 'Enter') setEditingVisitor(null); }} autoFocus />)
                                                    ) : (fmtVal(v.data[field.id]) || <span style={{ color: 'var(--ink-muted)' }}>-</span>)}
                                                </td>
                                            ))}
                                            <td>
                                                {v.disqualified ? (
                                                    <button className="btn btn-sm" style={{ fontSize: '11px', padding: '3px 8px' }} onClick={() => undoDisqualify(idx)}>Undo DQ</button>
                                                ) : (
                                                    <button className="btn btn-sm" style={{ fontSize: '11px', padding: '3px 8px', color: 'var(--danger)' }} onClick={() => setRetroDQ(retroDQ && retroDQ.index === idx ? null : { index: idx, reason: '' })}>DQ</button>
                                                )}
                                            </td>
                                        </tr>
                                        {retroDQ && retroDQ.index === idx && (
                                            <tr><td colSpan={99} style={{ padding: '0', background: 'var(--danger-light)' }}>
                                                <div style={{ padding: '12px 16px', display: 'flex', alignItems: 'center', gap: '10px', flexWrap: 'wrap' }}>
                                                    <span style={{ fontSize: '13px', fontWeight: 500, color: 'var(--danger)' }}>DQ Visitor #{idx + 1}:</span>
                                                    <input type="text" value={retroDQ.reason} onChange={e => setRetroDQ({ ...retroDQ, reason: e.target.value })} placeholder="Reason (optional)" style={{ flex: 1, minWidth: '150px', padding: '6px 10px', fontSize: '13px', borderColor: 'var(--danger-border)' }} onKeyDown={e => { if (e.key === 'Enter') retroDisqualify(idx, retroDQ.reason); }} />
                                                    <button className="btn btn-danger btn-sm" onClick={() => retroDisqualify(idx, retroDQ.reason)}>Confirm DQ</button>
                                                    <button className="btn btn-sm" onClick={() => setRetroDQ(null)}>Cancel</button>
                                                </div>
                                            </td></tr>
                                        )}
                                        </React.Fragment>
                                    ))}</tbody></table>
                                </div>
                            </>
                        )}
                    </div>
                </>
            );
        }
        function VisitorForm({ project, visitorData, setVisitorData, onSave, onCancel, timerRunning }) {
            const [recording, setRecording] = useState({});
            const recRef = useRef({});
            const startDict = (fid) => {
                if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) return;
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                const r = new SR(); r.continuous = true; r.interimResults = true;
                r.onresult = (e) => { let t = ''; for (let i = e.resultIndex; i < e.results.length; i++) t += e.results[i][0].transcript; setVisitorData(prev => ({ ...prev, [fid]: (prev[fid] || '') + ' ' + t })); };
                r.onerror = () => setRecording(p => ({ ...p, [fid]: false }));
                r.onend = () => setRecording(p => ({ ...p, [fid]: false }));
                r.start(); recRef.current[fid] = r; setRecording(p => ({ ...p, [fid]: true }));
            };
            const stopDict = (fid) => { if (recRef.current[fid]) { recRef.current[fid].stop(); setRecording(p => ({ ...p, [fid]: false })); } };

            return (
                <div>
                    {project.fields.map(f => (
                        <div key={f.id} className="form-group">
                            <label>{f.name}</label>
                            {f.type === 'text' && <input type="text" value={visitorData[f.id] || ''} onChange={e => setVisitorData({...visitorData, [f.id]: e.target.value})} />}
                            {f.type === 'number' && <input type="number" value={visitorData[f.id] || ''} onChange={e => setVisitorData({...visitorData, [f.id]: e.target.value})} />}
                            {f.type === 'select' && <select value={visitorData[f.id] || ''} onChange={e => setVisitorData({...visitorData, [f.id]: e.target.value})}><option value="">Select...</option>{f.options.map(o => <option key={o} value={o}>{o}</option>)}</select>}
                            {f.type === 'checkbox' && <div>{f.options.map(o => { const sel = visitorData[f.id] || []; const on = sel.includes(o.label); const w = dqWhenOf(o); const hit = (w === 'checked' && on) || (w === 'unchecked' && !on && !timerRunning); return (
                                <label key={o.label} className="checkbox-label" style={{ marginBottom: '8px', fontSize: '14px', ...(w ? { color: 'var(--danger)', background: hit ? 'var(--danger-light)' : 'transparent', border: '1px solid var(--danger-border)', borderRadius: 'var(--radius-sm)', padding: '8px 10px', fontWeight: hit ? 700 : 500 } : {}) }}>
                                    <input type="checkbox" checked={on} onChange={() => setVisitorData({ ...visitorData, [f.id]: on ? sel.filter(x => x !== o.label) : [...sel, o.label] })} />
                                    {o.label}{w && <span style={{ fontSize: '11px', marginLeft: '6px', fontWeight: 600 }}>{w === 'checked' ? '(disqualifies if checked)' : '(disqualifies if NOT checked)'}</span>}
                                </label>); })}</div>}
                            {f.type === 'textarea' && (<>
                                <textarea value={visitorData[f.id] || ''} onChange={e => setVisitorData({...visitorData, [f.id]: e.target.value})} />
                                {f.dictation && <div className="dictation-controls">
                                    {!recording[f.id] ? <button className="btn btn-primary btn-sm" onClick={() => startDict(f.id)}>{'\uD83C\uDFA4'} Dictation</button>
                                    : <><button className="btn btn-danger btn-sm" onClick={() => stopDict(f.id)}>{'\u23F9'} Stop</button><span className="recording">{'\u25CF'} Recording...</span></>}
                                </div>}
                            </>)}
                        </div>
                    ))}
                    <div className="button-group">
                        <button className="btn btn-success" onClick={onSave}>Save Visitor Data</button>
                        <button className="btn" onClick={onCancel}>Cancel</button>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
